# Builds Helix for macOS (Apple Silicon + Intel) and Windows, then publishes the
# installers + auto-update feed to this repo's GitHub Releases.
#
# Trigger: push a version tag, e.g.
#   git tag v1.0.0 && git push origin v1.0.0
#
# macOS installers build on a mac runner, Windows on a windows runner (Windows
# installers can't be produced reliably off Windows). Both publish into the same
# GitHub Release (electron-builder's github provider), which electron-updater reads.
name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write # electron-builder needs this to create/upload the Release

jobs:
  build:
    strategy:
      fail-fast: false # one platform failing shouldn't cancel the other
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # GitHub's macOS runners let Spotlight (mds) index the mounted DMG volume,
      # holding it busy so `hdiutil detach` fails ("resource busy") and the DMG
      # build dies. Turning indexing off for the run avoids the flake.
      - name: Disable Spotlight indexing (macOS DMG detach fix)
        if: runner.os == 'macOS'
        run: sudo mdutil -a -i off || true

      - run: npm ci

      # Decode the App Store Connect API key (.p8) from its base64 secret into a
      # file for notarytool. macOS job only.
      - name: Write notarization API key (macOS)
        if: runner.os == 'macOS'
        run: 'echo "$APPLE_API_KEY_P8" | base64 --decode > "$RUNNER_TEMP/api_key.p8"'
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}

      # macOS: signed with the Developer ID cert (CSC_LINK) + notarized via the
      # App Store Connect API key. Kept a separate step from Windows so the
      # signing env is scoped to mac only (an empty CSC_LINK on Windows would be
      # misread as a Windows cert path).
      - name: Build & publish (macOS)
        if: runner.os == 'macOS'
        run: npm run release:mac
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_API_KEY: ${{ runner.temp }}/api_key.p8
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}

      # Windows: ships UNSIGNED for now (users see a one-time SmartScreen prompt).
      - name: Build & publish (Windows)
        if: runner.os == 'Windows'
        run: npm run release:win
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
