# Builds Helix for macOS (Apple Silicon + Intel) and Windows, then publishes the
# installers + auto-update feed to this repo's GitHub Releases.
#
# Trigger: push a version tag, e.g.
#   git tag v1.0.0 && git push origin v1.0.0
#
# macOS installers build on a mac runner, Windows on a windows runner (Windows
# installers can't be produced reliably off Windows). Both upload into the same
# draft GitHub Release, which is published once both have finished (see publish).
name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write # electron-builder needs this to create/upload the Release

jobs:
  # Create the release as a draft first, so both platform builds upload into
  # the same draft instead of racing to create one each.
  prepare:
    runs-on: ubuntu-latest
    steps:
      - run: gh release view "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" --draft --title "$GITHUB_REF_NAME" --notes ""
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build:
    needs: prepare
    strategy:
      fail-fast: false # one platform failing shouldn't cancel the other
      matrix:
        # macos-15, not macos-latest: on the macOS 26 runner image electron-builder
        # 25's temporary signing keychain fails to unlock (set-key-partition-list:
        # "passphrase you entered is not correct"), which killed the v1.0.5 build.
        os: [macos-15, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # GitHub's macOS runners let Spotlight (mds) index the mounted DMG volume,
      # holding it busy so `hdiutil detach` fails ("resource busy") and the DMG
      # build dies. Turning indexing off for the run avoids the flake.
      - name: Disable Spotlight indexing (macOS DMG detach fix)
        if: runner.os == 'macOS'
        run: sudo mdutil -a -i off || true

      - run: npm ci

      # Decode the App Store Connect API key (.p8) from its base64 secret into a
      # file for notarytool. macOS job only.
      - name: Write notarization API key (macOS)
        if: runner.os == 'macOS'
        run: 'echo "$APPLE_API_KEY_P8" | base64 --decode > "$RUNNER_TEMP/api_key.p8"'
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}

      # macOS: signed with the Developer ID cert (CSC_LINK) + notarized via the
      # App Store Connect API key. Kept a separate step from Windows so the
      # signing env is scoped to mac only (an empty CSC_LINK on Windows would be
      # misread as a Windows cert path).
      - name: Build & publish (macOS)
        if: runner.os == 'macOS'
        run: npm run release:mac
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_API_KEY: ${{ runner.temp }}/api_key.p8
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}

      # Windows: ships UNSIGNED for now (users see a one-time SmartScreen prompt).
      - name: Build & publish (Windows)
        if: runner.os == 'Windows'
        run: npm run release:win
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Only once every platform has uploaded: publish the draft and mark it latest.
  # Until then the previous release stays "latest", so the updater feed and the
  # /download links never point at a release with missing files.
  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - run: gh release edit "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" --draft=false --latest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
