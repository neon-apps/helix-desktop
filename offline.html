<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'" />
<title>Offline</title>
<!--
  Shown over the Helix page when it cannot load (no connection, or Helix is
  unreachable). main.js keeps retrying in the background and removes this
  screen as soon as the page loads again.
-->
<style>
  :root { --bg: #0b0b0f; --fg: rgba(255,255,255,.9); --mute: rgba(255,255,255,.55); --line: rgba(255,255,255,.1); --btn: rgba(255,255,255,.08); --btn-hover: rgba(255,255,255,.14); }
  @media (prefers-color-scheme: light) {
    :root { --bg: #f7f7f9; --fg: rgba(0,0,0,.85); --mute: rgba(0,0,0,.55); --line: rgba(0,0,0,.1); --btn: rgba(0,0,0,.05); --btn-hover: rgba(0,0,0,.09); }
  }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg); font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; user-select: none; -webkit-user-select: none; cursor: default; }
  main { height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 24px; box-sizing: border-box; }
  .icon { width: 56px; height: 56px; border-radius: 16px; border: 1px solid var(--line); display: flex; align-items: center; justify-content: center; margin-bottom: 18px; color: var(--mute); }
  .icon svg { width: 26px; height: 26px; }
  h1 { font-size: 18px; font-weight: 600; margin: 0 0 6px; }
  p { margin: 0 0 20px; color: var(--mute); max-width: 340px; }
  button { appearance: none; border: 1px solid var(--line); background: var(--btn); color: var(--fg); font: inherit; font-weight: 500; height: 34px; padding: 0 16px; border-radius: 9px; display: inline-flex; align-items: center; gap: 8px; transition: background-color 120ms; }
  button:hover { background: var(--btn-hover); }
  button svg { width: 15px; height: 15px; }
  .busy svg { animation: spin .9s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .hint { margin-top: 14px; font-size: 12px; color: var(--mute); }
</style>
</head>
<body>
  <main>
    <div class="icon">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h.01"/><path d="M8.5 16.43a5 5 0 0 1 7 0"/><path d="M5 12.86a10 10 0 0 1 5.17-2.69"/><path d="M19 12.86a10 10 0 0 0-2.01-1.53"/><path d="M2 8.82a15 15 0 0 1 4.18-2.65"/><path d="M22 8.82a15 15 0 0 0-11.29-3.76"/><path d="m2 2 20 20"/></svg>
    </div>
    <h1>Can’t reach Helix</h1>
    <p>Check your internet connection. Helix will reload by itself as soon as it’s back.</p>
    <button id="retry">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-9-9c2.52 0 4.93 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/></svg>
      Try again
    </button>
    <div class="hint" id="hint">Retrying automatically</div>
  </main>
  <script>
    const btn = document.getElementById('retry');
    btn.addEventListener('click', () => {
      btn.classList.add('busy');
      window.helixBar.send('retry');
      setTimeout(() => btn.classList.remove('busy'), 1500);
    });
    const hint = document.getElementById('hint');
    const update = () => { hint.textContent = navigator.onLine ? 'Connected, trying to reach Helix…' : 'Waiting for a connection…'; };
    window.addEventListener('online', () => { update(); window.helixBar.send('retry'); });
    window.addEventListener('offline', update);
    update();
  </script>
</body>
</html>
